name: Refresh HEIVA Data

on:

  workflow_dispatch:

  schedule:

    - cron: "17 7 * * 1"


permissions:

  contents: write


jobs:

  refresh:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run HEIVA pipeline
        run: |
          python main.py


      - name: Commit refreshed outputs
        run: |

          git config user.name \
            "heiva-automation"

          git config user.email \
            "actions@github.com"

          git add \
            data/processed \
            outputs

          git diff --cached --quiet || \
          git commit -m \
            "Automated HEIVA data refresh"

          git push